<text x="44" y="722.68" font-family="Arial,sans-serif" font-size="24" fill="#805416">Why train tonight?</text>
<text x="44" y="757.86" font-family="Arial,sans-serif" font-size="23" fill="#172438">Frozen prompt and checkpoint changes did not solve localization. Longer controlled adaptation tests a different intervention; improvement is not assumed.</text>
<text x="24" y="838.04" font-family="Arial,sans-serif" font-size="22" fill="#526279">Data: 256 train / 64 validation crops, 19 / 4 disjoint patients; full-mask rewards. Timing subset: 8 crops / 51 nuclei.</text>
<text x="24" y="876.04" font-family="Arial,sans-serif" font-size="22" fill="#526279">Scope: selected engineering diagnostics, not a shared benchmark, weak-label result, or clinical evaluation.</text>
<text x="24" y="914.04" font-family="Arial,sans-serif" font-size="22" fill="#526279">Only the 20-step checks are complete. Longer-run results remain PENDING. Official test data stay outside tuning.</text>
