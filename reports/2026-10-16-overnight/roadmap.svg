<text x="34" y="857" font-family="Arial,sans-serif" font-size="21" dominant-baseline="text-before-edge" fill="#526279">Different scopes: Oct 9 validation16; Oct 15 training8 / 41; Oct 16 timing validation8 / 51 and full validation64 / 384 occurrences.</text>
<text x="34" y="895" font-family="Arial,sans-serif" font-size="21" dominant-baseline="text-before-edge" fill="#526279">Validation64: 340 unique source nuclei, four patients, partial fragments retained. Reused validation; no official test or clinical claim.</text>
